name: 24h Lottery Data Sync

on:
  schedule:
    # Runs daily at 06:00 UTC (11:00 PM PST / 2:00 AM EST after daily draws)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 24h Lottery Sync Pipeline
        run: |
          python3 sync_lottery_cron.py

      - name: Commit and push updated draw database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *_history.json *_history.csv history_meta.json history_meta.js
          if git diff --staged --quiet; then
            echo "No new lottery draws to commit."
          else
            git commit -m "Auto-sync: update official lottery draws [skip ci]"
            git push
          fi
